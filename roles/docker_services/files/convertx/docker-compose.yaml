---
services:
  convertx:
    image: ghcr.io/c4illin/convertx:v0.18.0
    container_name: convertx
    restart: unless-stopped
    volumes:
      - "convertx_data:/app/data"
    ports:
      - "8087:3000"
    environment:
      - HTTP_ALLOWED=true
      - ALLOW_UNAUTHENTICATED=true
      - UNAUTHENTICATED_USER_SHARING=true

volumes:
  convertx_data:
