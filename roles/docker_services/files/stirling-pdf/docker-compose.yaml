---
services:
  stirling-pdf:
    image: stirlingtools/stirling-pdf:2.14.2
    container_name: stirling-pdf
    restart: unless-stopped
    volumes:
      - "stirling_pdf_data:/configs"
    ports:
      - "8085:8080"
    environment:
      - SECURITY_ENABLELOGIN=false

volumes:
  stirling_pdf_data:
