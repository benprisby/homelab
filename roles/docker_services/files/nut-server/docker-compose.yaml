---
services:
  nut-server:
    image: instantlinux/nut-upsd:2.8.3-r2
    container_name: nut-server
    restart: unless-stopped
    devices:
      - /dev/bus/usb:/dev/bus/usb:rwm
    ports:
      - "3493:3493"
    environment:
      - API_USER=${NUT_MONITOR_USERNAME}
      - API_PASSWORD=${NUT_MONITOR_PASSWORD}
      - MAXAGE=25  # Increased for CyberPower UPS as per image documentation
    networks:
      - nut

  peanut:
    image: brandawg93/peanut:6.0.0
    container_name: peanut
    restart: unless-stopped
    volumes:
      - ./peanut.yaml:/config/settings.yml:ro
    environment:
      - DISABLE_CONFIG_FILE=true  # No saving
      - AUTH_DISABLED=true
    networks:
      - nut
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.peanut.rule=Host(`peanut.eastie.boston`)"
      - "traefik.http.routers.peanut.entrypoints=websecure"
      - "traefik.http.routers.peanut.tls.certresolver=cloudflare"
      - "traefik.http.services.peanut.loadbalancer.server.port=8080"

networks:
  nut:
  traefik:
    external: true

volumes:
  peanut_data:
