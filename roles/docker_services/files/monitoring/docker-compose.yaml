---
services:
  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - "./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro"
      - "prometheus_data:/prometheus"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring
      - traefik
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=90d"
      - "--web.enable-admin-api"
      - "--web.enable-lifecycle"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.eastie.boston`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.tls.certresolver=cloudflare"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"

  grafana:
    image: grafana/grafana:13.1.1
    container_name: grafana
    restart: unless-stopped
    volumes:
      - "grafana_data:/var/lib/grafana"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    networks:
      - monitoring
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.eastie.boston`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=cloudflare"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    network_mode: host
    pid: host
    restart: unless-stopped
    volumes:
      - "/:/host:ro,rslave"
      - "/var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket"
    command:
      - "--path.rootfs=/host"
      - "--collector.processes"
      - "--collector.systemd"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - "/:/rootfs:ro"
      - "/var/run:/var/run"
      - "/sys:/sys:ro"
      - "/var/lib/docker:/var/lib/docker:ro"
      - "/dev/disk:/dev/disk:ro"
      - "/etc/machine-id:/etc/machine-id:ro"
    devices:
      - /dev/kmsg
    ports:
      - "8080:8080"
    networks:
      - monitoring

  speedtest-exporter:
    image: miguelndecarvalho/speedtest-exporter:v3.5.4
    container_name: speedtest-exporter
    restart: unless-stopped
    ports:
      - "9798:9798"
    networks:
      - monitoring
    healthcheck:
      test: "wget --no-verbose --tries=1 --spider http://127.0.0.1:9798/"
      timeout: 10s

  unpoller:
    image: ghcr.io/unpoller/unpoller:v3.4.1
    container_name: unpoller
    restart: unless-stopped
    ports:
      - "9130:9130"
    environment:
      - UP_INFLUXDB_DISABLE=true
      - UP_POLLER_DEBUG=false
      - UP_UNIFI_DYNAMIC=false
      - UP_PROMETHEUS_HTTP_LISTEN=0.0.0.0:9130
      - UP_PROMETHEUS_NAMESPACE=unpoller
      - UP_UNIFI_CONTROLLER_0_SAVE_ALARMS=true
      - UP_UNIFI_CONTROLLER_0_SAVE_ANOMALIES=true
      - UP_UNIFI_CONTROLLER_0_SAVE_DPI=true
      - UP_UNIFI_CONTROLLER_0_SAVE_EVENTS=true
      - UP_UNIFI_CONTROLLER_0_SAVE_IDS=true
      - UP_UNIFI_CONTROLLER_0_SAVE_SITES=true
      - UP_UNIFI_CONTROLLER_0_URL=${UNIFI_URL}
      - UP_UNIFI_CONTROLLER_0_USER=${UNIFI_USER}
      - UP_UNIFI_CONTROLLER_0_PASS=${UNIFI_PASS}
    networks:
      - monitoring

  uptime-kuma:
    image: louislam/uptime-kuma:2.5.0
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - uptime_kuma_data:/app/data
    environment:
      - UPTIME_KUMA_CLOUDFLARED_TOKEN=${UPTIME_KUMA_CLOUDFLARED_TOKEN}
    networks:
      - monitoring
      - traefik
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 5s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uptime-kuma.rule=Host(`uptime.eastie.boston`)"
      - "traefik.http.routers.uptime-kuma.entrypoints=websecure"
      - "traefik.http.routers.uptime-kuma.tls.certresolver=cloudflare"
      - "traefik.http.services.uptime-kuma.loadbalancer.server.port=3001"

  nut-exporter:
    image: druggeri/nut_exporter:3.3.0
    container_name: nut-exporter
    restart: unless-stopped
    environment:
      - "NUT_EXPORTER_SERVER=${NUT_SERVER_ADDRESS}"
      - "NUT_EXPORTER_USERNAME=${NUT_MONITOR_USERNAME}"
      - "NUT_EXPORTER_PASSWORD=${NUT_MONITOR_PASSWORD}"
    networks:
      - monitoring

  loki:
    image: grafana/loki:3.7.4
    container_name: loki
    restart: unless-stopped
    volumes:
      - "./loki.yaml:/etc/loki/loki.yaml:ro"
      - "loki_data:/loki"
    command:
      - "-config.file=/etc/loki/loki.yaml"
    ports:
      - "3100:3100"
    networks:
      - monitoring

  alloy:
    image: grafana/alloy:v1.18.0
    container_name: alloy
    restart: unless-stopped
    network_mode: host
    volumes:
      - "./alloy.alloy:/etc/alloy/config.alloy:ro"
      - "alloy_data:/var/lib/alloy/data"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "/var/log/journal:/var/log/journal:ro"
      - "/etc/machine-id:/etc/machine-id:ro"
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "--disable-reporting"
      - "/etc/alloy/config.alloy"

networks:
  monitoring:
    external: true
  traefik:
    external: true

volumes:
  prometheus_data:
  grafana_data:
  uptime_kuma_data:
  loki_data:
  alloy_data:
